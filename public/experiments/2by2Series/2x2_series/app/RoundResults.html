{% extends "global/Page.html" %}

{{ block title }}
    Round {{ game_round }} Results
{{ endblock }}

{{ block content }}
<div class="container mt-3">

    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
        <div class="card-body p-5 text-center">

            <div class="row mb-4">
                <div class="col-md-6 border-end">
                    <h5 class="text-muted">You Chose</h5>
                    <h2 class="fw-bold text-primary display-4">Action {{ player.choice }}</h2>
                </div>
                <div class="col-md-6">
                    <h5 class="text-muted">Opponent Chose</h5>
                    <h2 class="fw-bold text-secondary display-4">Action {{ player.opponent_choice }}</h2>
                </div>
            </div>

            <hr style="margin: 30px 0; border-color: #ddd;">

            <div class="row mt-4">
                <div class="col-md-6 border-end">
                    <h5 class="text-muted">Your Payoff</h5>
                    <h1 class="fw-bold text-success">{{ my_payoff }}</h1>
                </div>
                <div class="col-md-6">
                    <h5 class="text-muted">Opponent's Payoff</h5>
                    <h2 class="fw-bold text-secondary">{{ opponent_payoff }}</h2>
                </div>
            </div>

        </div>
    </div>

    <div class="text-center mt-4 mb-5">
        <button class="otree-btn-next btn btn-primary btn-lg px-5 shadow-sm" style="border-radius: 10px;">
            Continue to Next Round
        </button>
    </div>

</div>

<style>
    body { background-color: #f8f9fa; }

    /* Hide default oTree footers */
    .otree-footer, .footer {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        padding: 0 !important;
    }
</style>
{{ endblock }}
